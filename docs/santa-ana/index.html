<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dr. George: Historical Santa Ana</title>

    <!-- CSS Styling -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous">
    <!-- <link href="css/main.css" rel="stylesheet"> -->

    <!-- Favicon -->
    <!-- <link rel="icon" type="image/png" href="favicon.ico" /> -->
    <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
    <link rel="manifest" href="img/favicon/site.webmanifest">

    <!-- Global site tag (gtag.js) - Google Analytics -->

    <script>
      window.dataLayer = window.dataLayer || [];

      gtag('config', 'TBA');

    <style>
      /* The chart fills this box (maintainAspectRatio: false): about 2:1 on
         desktop as before, taller than 2:1 on a phone so it stays readable,
         and never taller than 80% of the screen (a phone held sideways). */
      .chart-block {
        height: 50vw;
        min-height: min(360px, 80vh);
        max-height: min(560px, 80vh);
      }
      .match-panel {
        position: absolute;
        z-index: 10;
        width: 15rem;
        max-width: calc(100% - 1rem);
      }
      /* Scroll after about 10 rows */
      .match-panel .match-list {
        max-height: 18rem;
        overflow-y: auto;
      }
      @media (max-width: 576px) {
        .match-panel .match-list {
          max-height: 10rem;
        }
      }
    </style>
  </head>

  <body>
    <!-- Source: https://getbootstrap.com/docs/5.2/examples/headers/ -->
    <div class="container">
      <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
        <a href="https://en.wikipedia.org/wiki/George_Fischbeck"
           class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none"
           target="_blank">
          <img src="img/dr-george.png" alt="Logo" style="height: 40px; margin-right: 10px;">
          <span class="fs-4">Dr. George</span>
        </a>
        <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
          <li>
            <a
              href="https://www.ncei.noaa.gov/cdo-web/datasets"
              class="nav-link px-2 link-dark"
              target="_blank">
                Data
             </a>
          </li>
          <li>
            <a
              href="https://github.com/klenwell/dr-george"
              class="nav-link px-2 link-dark"
              target="_blank">
                Code
             </a>
          </li>
        </ul>
      </header>

      <main>
        <section class="chart">
          <header class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-4 mt-md-5">
            <h3>Santa Ana Fire Station &bull; USC00047888</h3>
            <div>
              <button id="replay" class="btn btn-primary me-2" disabled>Animate &#10024;</button>
              <label for="yearSelector">Select a Year:</label>
              <select id="yearSelector">
                <option>Click Here</option>
              </select>
            </div>
          </header>
          <div class="chart-block mt-1 position-relative">
            <canvas id="chart"></canvas>
            <div id="chartLoading" class="position-absolute top-50 start-50 translate-middle text-muted">
              Loading temperatures since 1917&hellip;
            </div>
          </div>
          <h4>Notes</h4>
          <ul>
            <li>
              Data sourced from
              <a target="_blank" href="https://www.ncei.noaa.gov/cdo-web/datasets/GHCND/stations/GHCND:USC00047888/detail">NOAA</a>.
            </li>
          </ul>
        </section>
      </main>

    <!--
      Javascript
    -->
    <!-- Third-Party (CDN) -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
      integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous">
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/luxon@2.4.0/build/global/luxon.min.js"
      integrity="sha256-DIsAGD2EF8Qq2PCH9yzX/yt9FliJfWf+aGcdgR6tKwo="
      crossorigin="anonymous">
    </script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.8.0/chart.min.js"
      integrity="sha512-sW/w8s4RWTdFFSduOTGtk4isV1+190E/GghVffMA9XczdJ2MDzSzLEubKAs5h0wzgSJOQTRYyaz73L3d6RtJSg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer">
    </script>

    <!-- Components -->
    <script src="js/annual-station-data.js"></script>
    <script src="js/year-selector.js"></script>
    <script src="js/chart-animator.js"></script>
    <script src="js/match-panel.js"></script>
    <script src="js/chart.js"></script>
  </body>
</html>
